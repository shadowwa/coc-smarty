# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

# Hardened: deny by default, grant per job
permissions: {}

on:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false       # no token left in .git/config
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts
      - run: npm run build    # third-party code runs HERE, not in publish
      - name: Install editors
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim vim
      - run: npm run test
      - run: npm pack         # the exact tarball that will be published
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: package-tarball, path: "*.tgz" }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for OIDC
    steps:
      # No checkout at all: the privileged job never holds project source,
      # so it needs no contents: read either.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: package-tarball, path: out }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: <https://registry.npmjs.org>
      # Publishing the prepared tarball, not a working directory: npm runs
      # prepublishOnly only for directory publishes, so no project code runs
      # here at all. --ignore-scripts keeps that true if this ever changes.
      - run: npm stage publish ./out/*.tgz --ignore-scripts
